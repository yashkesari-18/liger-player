# Builds LigerPlayer for Windows on GitHub's own Windows machines.
#  - Every push to main, and every manual run (Actions tab → "Build Windows app" → Run workflow), produces
#    a downloadable "LigerPlayer-windows" artifact containing the installer and the portable zip.
#  - Pushing a tag such as v0.3.0 also publishes them on the repository's Releases page.
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["desktop/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
          pip list

      - name: Download libmpv (playback engine)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "liger-build" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "No mpv-dev-x86_64 package found in release $($rel.tag_name)" }
          Write-Host "Using $($asset.name) from $($rel.tag_name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          Get-ChildItem -Path mpv-dev -Recurse -Filter *.dll | ForEach-Object { Write-Host "found $($_.FullName)" }
          $dll = Get-ChildItem -Path mpv-dev -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found in $($asset.name)" }
          Copy-Item $dll.FullName desktop\libmpv-2.dll
          "$($asset.name)" | Out-File desktop\LIBMPV-VERSION.txt -Encoding utf8

      - name: Self-test from source (shows Python errors directly)
        working-directory: desktop
        continue-on-error: true
        shell: pwsh
        run: |
          python -X faulthandler run_liger.py --selftest "$PWD\selftest-src.txt"
          Write-Host "exit code: $LASTEXITCODE"
          if (Test-Path selftest-src.txt) { Get-Content selftest-src.txt } else { Write-Host "no log written" }

      - name: Build LigerPlayer.exe
        working-directory: desktop
        run: pyinstaller --noconfirm liger.spec

      - name: Check that the engine loads
        id: selftest
        working-directory: desktop
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem dist\LigerPlayer\_internal -Filter *mpv* | ForEach-Object { Write-Host "bundled $($_.Name) $($_.Length) bytes" }
          $p = Start-Process -FilePath "dist\LigerPlayer\LigerPlayer.exe" -ArgumentList "--selftest", "`"$PWD\selftest.txt`"" -PassThru -Wait
          Write-Host ("exit code: {0} (0x{0:X8})" -f $p.ExitCode)
          if (-not (Test-Path selftest.txt)) { throw "LigerPlayer.exe exited before writing its self-test log" }
          $r = Get-Content selftest.txt -Raw
          Write-Host "---- self-test log ----"; Write-Host $r
          if ($r -notmatch "(?m)^ok ") { throw "LigerPlayer.exe could not start the playback engine (see log above)" }

      - name: Diagnose (console build prints start-up errors)
        if: steps.selftest.outcome == 'failure'
        working-directory: desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $env:LIGER_CONSOLE = "1"
          pyinstaller --noconfirm --log-level WARN --distpath dist-console --workpath build-console liger.spec
          $ErrorActionPreference = "Continue"
          cmd /c "dist-console\LigerPlayer\LigerPlayer.exe --selftest `"$PWD\selftest-console.txt`" 2>&1"
          Write-Host ("exit code: {0} (0x{0:X8})" -f $LASTEXITCODE)
          if (Test-Path selftest-console.txt) { Get-Content selftest-console.txt }

      - name: Version number
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.3.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item LICENSE-DESKTOP.txt, desktop\THIRD-PARTY-NOTICES.txt, desktop\LIBMPV-VERSION.txt desktop\dist\LigerPlayer\
          Compress-Archive -Path desktop\dist\LigerPlayer -DestinationPath "dist\LigerPlayer-${{ steps.ver.outputs.version }}-portable.zip" -Force
          if (Test-Path desktop\selftest.txt) { Copy-Item desktop\selftest.txt dist\ }
          if (Test-Path desktop\selftest-src.txt) { Copy-Item desktop\selftest-src.txt dist\ }

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" desktop\installer.iss

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LigerPlayer-windows
          path: dist/*
          if-no-files-found: warn

      - name: Fail if the self-test failed
        if: steps.selftest.outcome == 'failure'
        shell: pwsh
        run: throw "The build finished, but LigerPlayer.exe failed its self-test. Its log is in the artifact (selftest.txt)."

      - name: Publish release
        if: github.ref_type == 'tag' && steps.selftest.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
