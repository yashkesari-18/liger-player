<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Liger Player: a free, open-source media player with RGB lighting, Live TV and Tigu the tiger.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<title>Liger Player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: stage (screen + deck) beside a Queue / Live TV rail; settings drawer slides in. Tokens drive light/dark, accent and RGB lighting. */
@property --off{syntax:'<length>';inherits:false;initial-value:0px}
@property --rot{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#f6f7fa; --panel:#ffffff; --ink:#151821; --muted:#687085; --line:#e2e5ed; --screen:#eceff5;
  --viz-idle:#c8cfdd; --scrim:rgba(20,24,33,.28);
  --accent:#2f6bff; --accent-ink:#ffffff; --glow-k:45;
  --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--panel));
  --glow:color-mix(in srgb,var(--accent) calc(var(--glow-k)*1%),transparent);
  --f-script:system-ui;
  --f-display:"Chakra Petch",var(--f-script),"Segoe UI",sans-serif;
  --f-body:"Manrope",var(--f-script),"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --t:1; --cut:8px; --zoom:1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c0e13; --panel:#14171f; --ink:#e7eaf1; --muted:#8b93a7; --line:#252a36; --screen:#0f1218;
  --viz-idle:#2b3140; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c0e13; --panel:#14171f; --ink:#e7eaf1; --muted:#8b93a7; --line:#252a36; --screen:#0f1218;
  --viz-idle:#2b3140; --scrim:rgba(0,0,0,.55); color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);transition:background calc(.3s*var(--t)),color calc(.3s*var(--t));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
body.corners-sharp{--cut:0px}
body.corners-round .cut{clip-path:none;border-radius:10px}
body.corners-round .stage,body.corners-round aside,body.corners-round .drawer{border-radius:12px}

.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;zoom:var(--zoom)}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.05em}
.mark{width:26px;height:26px;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%)}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em}
.hdr{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;padding:9px 14px;border:1px solid var(--line);background:var(--panel);
  transition:background calc(.2s*var(--t)) var(--ease),color calc(.2s*var(--t)),transform .15s var(--ease)}
.chip:hover{background:var(--ink);color:var(--panel)}
.chip:active{transform:scale(.96)}
.chip.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 16px var(--glow)}
.chip.primary:hover{background:var(--ink);color:var(--panel)}
.chip.sm{font-size:12px;padding:7px 11px}

/* Stage + RGB ring */
.stage{background:var(--panel);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column;position:relative}
.stage::before,.stage::after{content:"";position:absolute;inset:-2px;padding:2px;pointer-events:none;z-index:3;display:none;background:var(--accent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.stage::after{filter:blur(9px);opacity:calc(var(--glow-k)/100);z-index:-1}
body.z-ring .stage::before,body.z-ring .stage::after{display:block}
.stage:fullscreen::before,.stage:fullscreen::after{display:none!important}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--screen);overflow:hidden}
.screen video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;transform-origin:center}
.screen.is-video{background:#000}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.screen.is-video #viz{display:none}
#tigu{image-rendering:pixelated;image-rendering:crisp-edges}
.corner{position:absolute;width:18px;height:18px;border-color:var(--accent);border-style:solid;opacity:.6;pointer-events:none}
.c1{top:12px;left:12px;border-width:2px 0 0 2px}.c2{top:12px;right:12px;border-width:2px 2px 0 0}
.c3{bottom:12px;left:12px;border-width:0 0 2px 2px}.c4{bottom:12px;right:12px;border-width:0 2px 2px 0}
.nowtag{position:absolute;left:20px;top:18px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowtag .live{color:#fff;background:#e5383b;padding:1px 6px;margin-inline-end:6px;font-weight:500}
.screen.is-video .nowtag{color:#fff;text-shadow:0 1px 3px #000}
.osd{position:absolute;right:20px;top:16px;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent);background:var(--panel);padding:4px 12px;
  opacity:0;transform:translateY(-6px);transition:opacity .25s var(--ease),transform .25s var(--ease);pointer-events:none;z-index:4}
.osd.show{opacity:1;transform:none}
.stats{position:absolute;left:20px;top:40px;font-family:var(--f-mono);font-size:11px;line-height:1.65;background:color-mix(in srgb,var(--panel) 88%,transparent);
  border-left:2px solid var(--accent);padding:8px 12px;font-variant-numeric:tabular-nums;white-space:pre;pointer-events:none;z-index:4}
.stats b{color:var(--accent);font-weight:500}
.drop{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 92%,transparent);border:2px dashed var(--accent);
  font-family:var(--f-display);font-size:20px;letter-spacing:.06em;color:var(--accent);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.screen.dragging .drop{opacity:1}
.bigplay{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;background:var(--panel);border:1px solid var(--line);z-index:4;
  display:grid;place-items:center;--cut:14px;transition:transform calc(.25s*var(--t)) var(--ease),opacity calc(.25s*var(--t))}
.bigplay svg{width:30px;height:30px;fill:var(--accent);margin-left:4px}
.bigplay:hover{transform:scale(1.06)}
.playing .bigplay{opacity:0;transform:scale(.8);pointer-events:none}

.deck{padding:14px 18px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);direction:ltr;background:var(--panel);
  transition:opacity calc(.3s*var(--t)),transform calc(.3s*var(--t)) var(--ease)}
.seekrow{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek{position:relative;flex:1;height:22px;cursor:pointer;touch-action:none}
.track{position:absolute;left:0;right:0;top:9px;height:4px;background:var(--line)}
.buf,.fill{position:absolute;left:0;top:0;height:100%}
.buf{background:color-mix(in srgb,var(--muted) 35%,var(--line))}
.fill{background:var(--accent);box-shadow:0 0 10px var(--glow)}
.ab{position:absolute;top:-3px;height:10px;background:var(--accent-soft);border-inline:2px solid var(--accent);display:none}
.thumb{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;background:var(--panel);border:3px solid var(--accent);transform:rotate(45deg) scale(.7);transition:transform .2s var(--ease)}
.seek:hover .thumb,.seek.active .thumb{transform:rotate(45deg) scale(1)}
.hovertime{position:absolute;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:2px 6px;font-size:11px;opacity:0;transition:opacity .15s;pointer-events:none}
.seek:hover .hovertime{opacity:1}
.controls{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ib{width:40px;height:40px;display:grid;place-items:center;position:relative;transition:background calc(.2s*var(--t)) var(--ease),transform .15s var(--ease)}
.ib svg{width:20px;height:20px;fill:var(--ink);transition:fill .2s}
.ib:hover{background:var(--accent-soft)}
.ib:hover svg,.ib.on svg{fill:var(--accent)}
.ib:active{transform:scale(.9)}
.ib.on::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;background:var(--accent);transform:rotate(45deg)}
.ib.main{width:48px;height:48px;background:var(--accent);--cut:10px;box-shadow:0 0 18px var(--glow)}
.ib.main svg{fill:var(--accent-ink);width:22px;height:22px}
.ib.main:hover{filter:brightness(1.12)}
.ib.main:hover svg{fill:var(--accent-ink)}
.spacer{flex:1}
.vol{display:flex;align-items:center;gap:4px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;width:100%;background:linear-gradient(var(--accent),var(--accent)) 0/var(--v,50%) 100% no-repeat,var(--line);cursor:pointer;border-radius:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--panel);border:3px solid var(--accent);transform:rotate(45deg)}
input[type=range]::-moz-range-thumb{width:8px;height:8px;background:var(--panel);border:3px solid var(--accent);border-radius:0}
input[type=range]:disabled{opacity:.4;cursor:not-allowed}
.vol input{width:90px}
.pill{font-family:var(--f-mono);font-size:12px;padding:6px 9px;border:1px solid var(--line);min-width:52px;text-align:center;font-variant-numeric:tabular-nums;transition:border-color .2s,color .2s}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.stage:fullscreen{border:0;background:#000}
.stage:fullscreen .screen{position:absolute;inset:0;aspect-ratio:auto}
.stage:fullscreen .deck{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--panel) 90%,transparent)}
.stage.idle .deck{opacity:0;transform:translateY(100%)}
.stage.idle{cursor:none}

/* Rail: Queue / Live TV */
aside{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 100px);min-height:420px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:13px 10px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;transition:color calc(.2s*var(--t)),border-color calc(.2s*var(--t))}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button span{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-inline-start:6px;letter-spacing:0}
.pane{display:flex;flex-direction:column;min-height:0;flex:1}
.queue{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.queue li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;cursor:pointer;border-inline-start:3px solid transparent;
  transition:background calc(.2s*var(--t)) var(--ease);animation:slide calc(.35s*var(--t)) var(--ease) both}
.queue li:hover{background:var(--paper)}
.queue li.cur{border-inline-start-color:var(--accent);background:var(--accent-soft)}
.queue .idx{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.queue li.cur .idx{color:var(--accent)}
.queue .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue .meta{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue .x{opacity:0;width:24px;height:24px;font-size:16px;color:var(--muted)}
.queue li:hover .x,.queue .x:focus-visible{opacity:1}
.empty{padding:24px 16px;color:var(--muted);font-size:13px;line-height:1.6;cursor:default!important;display:block!important}
.keys{border-top:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;color:var(--ink);border:1px solid var(--line);border-bottom-width:2px;padding:1px 6px;text-align:center;background:var(--panel)}
@keyframes slide{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.tvbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:10px 10px 6px}
.tvbar input,.tvbar select{padding:7px 9px;border:1px solid var(--line);background:var(--paper);font-size:13px;min-width:0}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 10px;scrollbar-width:thin}
.fchip{display:flex;align-items:center;gap:6px;flex:none;padding:5px 9px;border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap;transition:border-color .2s,background .2s}
.fchip small{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:10px}
.fchip:hover{border-color:var(--accent)}
.fchip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tvli{grid-template-columns:28px minmax(0,1fr) auto!important}
.tvli.dead{opacity:.45}
.tvli .star{width:28px;height:28px;font-size:15px;color:var(--muted)}
.tvli .star.on{color:#f5a524}
.more{margin:6px auto 10px;display:block}
.tvfoot{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px;font-size:12px;color:var(--muted)}
.tvfoot .acts{display:flex;gap:6px;flex-wrap:wrap}
.note{padding:9px 11px;font-size:12px;line-height:1.5;background:var(--accent-soft);border-inline-start:3px solid var(--accent);color:var(--ink)}

/* Flags: 6 slices that ripple like cloth on hover */
.flag{--fw:24px;--fh:16px;display:inline-flex;width:var(--fw);height:var(--fh);flex:none;position:relative;filter:drop-shadow(0 0 .5px rgba(0,0,0,.45))}
.flag i{flex:1;height:100%;background-image:var(--f);background-size:var(--fw) var(--fh);background-position:calc(var(--i) * var(--fw) / -6) 0;will-change:transform}
.flag.nf{align-items:center;justify-content:center;font-family:var(--f-mono);font-size:8px;font-weight:500;background:var(--line);color:var(--ink)}
:is(.fchip,.tvli,.flagdemo):hover .flag i,.fchip:focus-visible .flag i{animation:cloth 1.05s ease-in-out infinite;animation-delay:calc(var(--i) * -.16s)}
@keyframes cloth{0%,100%{transform:translateY(0) scaleY(1);filter:brightness(1)}25%{transform:translateY(-1.4px) scaleY(.96);filter:brightness(1.18)}75%{transform:translateY(1.4px) scaleY(1.02);filter:brightness(.82)}}

/* Settings drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity calc(.3s*var(--t));z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform calc(.4s*var(--t)) var(--ease);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
[dir=rtl] .drawer{right:auto;left:0;border-left:0;border-right:1px solid var(--line);transform:translateX(-102%)}
.drawer.open{transform:none!important}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative}
.dhead::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);display:none}
body.z-drawer .dhead::after{display:block}
.dhead h2{margin:0;font-family:var(--f-display);font-size:18px;letter-spacing:.05em;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{font-size:12px;font-weight:600;padding:6px 11px;color:var(--muted);transition:background calc(.2s*var(--t)),color calc(.2s*var(--t))}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--paper)}
.dsearch{padding:10px 18px;border-bottom:1px solid var(--line)}
.dbody{flex:1;display:grid;grid-template-columns:190px minmax(0,1fr);min-height:0}
.dbody.simple{grid-template-columns:minmax(0,1fr)}
.dbody.simple nav{display:none}
nav.cats{border-right:1px solid var(--line);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:2px}
[dir=rtl] nav.cats{border-right:0;border-left:1px solid var(--line)}
nav.cats button{text-align:start;padding:10px 12px;font-weight:600;font-size:13px;color:var(--muted);border-inline-start:3px solid transparent;transition:background calc(.2s*var(--t)),color calc(.2s*var(--t))}
nav.cats button:hover{color:var(--ink);background:var(--paper)}
nav.cats button[aria-current=true]{color:var(--accent);border-inline-start-color:var(--accent);background:var(--accent-soft)}
.list{overflow:auto;padding:6px 18px 30px}
.grp{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row.wide{grid-template-columns:minmax(0,1fr)}
.row .lb{font-weight:600;font-size:14px}
.row .hn{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.row .ctl{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap;min-width:0}
.row.wide .ctl{justify-content:flex-start}
.row.eng .lb::after{content:attr(data-badge);font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.04em;margin-inline-start:8px;padding:2px 6px;border:1px solid var(--line);color:var(--muted);vertical-align:2px}
.row.eng .ctl{opacity:.55}
.out{font-family:var(--f-mono);font-size:12px;min-width:56px;text-align:end;font-variant-numeric:tabular-nums;color:var(--muted)}
select,.txt{padding:7px 10px;border:1px solid var(--line);background:var(--paper);max-width:100%}
.txt{font-family:var(--f-mono);font-size:12px;width:100%}
.sw{width:42px;height:24px;background:var(--line);position:relative;transition:background calc(.2s*var(--t))}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:16px;height:16px;background:var(--panel);transition:transform calc(.25s*var(--t)) var(--ease)}
.sw[aria-checked=true]{background:var(--accent);box-shadow:0 0 12px var(--glow)}
.sw[aria-checked=true]::after{transform:translateX(18px)}
.sw:disabled{cursor:not-allowed}
.acc{display:grid;gap:12px;padding:6px 0 2px;width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border:2px solid var(--panel);outline:1px solid var(--line);transition:transform .15s var(--ease)}
.swatches button:hover{transform:scale(1.1)}
.swatches button[aria-pressed=true]{outline:2px solid var(--ink)}
.rgbrow{display:grid;grid-template-columns:18px minmax(0,1fr) 48px;gap:10px;align-items:center;font-family:var(--f-mono);font-size:12px}
.rgbrow input[type=number]{width:48px;padding:3px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:12px}
.hexrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hexrow input{width:110px;padding:7px 10px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono)}
.prev{width:36px;height:36px;background:var(--accent);box-shadow:0 0 16px var(--glow)}
.rgbprev{height:34px;width:100%;border:1px solid var(--line);background:var(--accent)}
.dirpad{display:grid;grid-template-columns:repeat(3,34px);gap:4px}
.dirpad button{height:34px;border:1px solid var(--line);font-size:15px;transition:background .2s}
.dirpad button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dirpad button:disabled{opacity:.3}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;width:100%}
.pals button{display:grid;gap:5px;padding:6px;border:1px solid var(--line);font-size:12px;font-weight:600;text-align:start}
.pals button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pals .bar{height:10px}
.custom{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.custom input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);background:none}
.zones{display:flex;gap:6px;flex-wrap:wrap}
.zones button{padding:6px 10px;border:1px solid var(--line);font-size:12px;font-weight:600}
.zones button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.eq{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-items:end;padding:8px 0;overflow-x:auto}
.eq label{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.eq input{writing-mode:vertical-lr;direction:rtl;width:4px;height:110px;background:linear-gradient(0deg,var(--accent),var(--accent)) bottom/100% var(--v,50%) no-repeat,var(--line)}
.hk{width:100%;border-collapse:collapse;font-size:13px}
.hk td{padding:7px 0;border-bottom:1px solid var(--line)}
.hk td:last-child{text-align:end}
.hk button{font-family:var(--f-mono);font-size:12px;min-width:74px;padding:4px 8px;border:1px solid var(--line);border-bottom-width:2px}
.hk button.wait{border-color:var(--accent);color:var(--accent)}
.urls{display:grid;gap:6px;width:100%}
.urls .u{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;font-family:var(--f-mono);font-size:11px;padding:6px 8px;border:1px solid var(--line);word-break:break-all}
.urls .add{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px}
.banner{margin:12px 0 0;padding:10px 12px;font-size:12px;line-height:1.5;background:var(--accent-soft);border-inline-start:3px solid var(--accent)}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);width:min(640px,100%);max-height:90vh;overflow:auto;padding:18px;display:grid;gap:12px}
.modal h3{margin:0;font-family:var(--f-display);font-size:16px;letter-spacing:.05em}
.modal img{width:100%;border:1px solid var(--line)}
.modal textarea{width:100%;height:280px;font-family:var(--f-mono);font-size:12px;padding:10px;border:1px solid var(--line);background:var(--paper);resize:vertical}
.modal p{margin:0;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{max-height:none}
  .queue{max-height:440px}
  .keys{display:none}
  .vol input{width:64px}
  .dbody{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  nav.cats{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav.cats button{white-space:nowrap;border-inline-start:0;border-bottom:3px solid transparent}
  nav.cats button[aria-current=true]{border-bottom-color:var(--accent)}
  .row{grid-template-columns:minmax(0,1fr)}
  .row .ctl{justify-content:flex-start}
}
@keyframes rgbOff{to{--off:480px}}
@keyframes rgbRot{to{--rot:360deg}}
@keyframes rgbBreath{0%,100%{filter:brightness(.55) saturate(.7)}50%{filter:brightness(1.15) saturate(1.1)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

let list=[],cur=-1,live=null,hls=null,loop=0,shuffle=false,A=null,B=null,ac=null,N={};

const hasMedia=()=>cur>=0||!!live;

function demoWav(){
  const sr=22050,dur=16,n=sr*dur,buf=new ArrayBuffer(44+n*2),d=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);
  d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
  const prog=[[57,60,64,69],[53,57,60,65],[48,52,55,60],[55,59,62,67]],bass=[45,41,36,43],step=.125;
  for(let i=0;i<n;i++){const tt=i/sr,bar=Math.floor(tt/2)%4,k=Math.floor(tt/step),ph=(tt%step)/step;
    const f=440*2**((prog[bar][k%4]+12-69)/12),fb=440*2**((bass[bar]-69)/12);
    let s=((tt*f)%1<.5?1:-1)*.16*Math.exp(-ph*3)+((tt*fb)%1<.5?1:-1)*.12+(Math.floor(tt/.5)%2===0&&ph<.15&&k%4===0?(Math.random()*2-1)*.2*(1-ph/.15):0);
    const fade=Math.min(1,tt/.5,(dur-tt)/1.5);d.setInt16(44+i*2,clamp(s*fade,-1,1)*32767,true)}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

function renderQueue(){
  const q=$('queue');q.innerHTML='';$('qCount').textContent=list.length;
  if(!list.length){const li=document.createElement('li');li.className='empty';li.textContent=t('empty');q.appendChild(li);return}
  list.forEach((it,i)=>{const li=document.createElement('li');if(i===cur)li.className='cur';li.style.animationDelay=(i*30)+'ms';
    li.innerHTML=`<span class="idx">${String(i+1).padStart(2,'0')}</span><div style="min-width:0"><div class="nm"></div><div class="meta">${it.kind.toUpperCase()} · ${it.dur?fmt(it.dur):'--:--'}${it.demo?' · SAMPLE':''}</div></div><button class="x" aria-label="Remove">×</button>`;
    li.querySelector('.nm').textContent=it.name;
    li.onclick=e=>{if(e.target.classList.contains('x')){remove(i);e.stopPropagation()}else load(i,true)};q.appendChild(li)})
}
function remove(i){URL.revokeObjectURL(list[i].url);list.splice(i,1);if(i===cur){cur=-1;v.removeAttribute('src');v.load();setNow()}else if(i<cur)cur--;renderQueue()}
function setNow(){const n=$('nowtag');if(live){n.innerHTML=`<span class="live">LIVE</span>${esc(live.n)}`;return}n.textContent=cur<0?t('nomedia'):`${String(cur+1).padStart(2,'0')} / ${list[cur].name}`}
function add(files){const start=list.length;
  [...files].forEach(f=>{if(!/^(video|audio)\//.test(f.type)&&!/\.(mkv|mp4|webm|mp3|flac|wav|ogg|opus|m4a|mov)$/i.test(f.name))return;
    const aud=f.type.startsWith('audio')||/\.(mp3|flac|wav|ogg|opus|m4a)$/i.test(f.name);
    list.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f),kind:aud?'audio':'video'})});
  renderQueue();if(list.length>start){tiguReact('pounce');if(cur<0||list[cur].demo)load(start,true)}}
function stopHls(){if(hls){try{hls.destroy()}catch(e){}hls=null}}
function load(i,play){if(i<0||i>=list.length)return;stopHls();live=null;cur=i;A=B=null;drawAB();subTrack=null;
  [...v.querySelectorAll('track')].forEach(x=>x.remove());$('bCC').classList.remove('on');
  const it=list[i];v.src=it.url;screen.classList.toggle('is-video',it.kind==='video');setNow();renderTV();
  v.addEventListener('loadedmetadata',()=>{it.dur=v.duration;renderQueue();layoutVideo();v.playbackRate=+S.speed;v.preservesPitch=S.pitch;
    const pos=S.resume?store.get('pos:'+it.name,0):0;if(pos>5&&pos<v.duration-5){v.currentTime=pos;osd('↻ '+fmt(pos))}},{once:true});
  renderQueue();mediaMeta();if(play)go()}
function go(){initAudio();v.play().catch(()=>{})}
function toggle(){if(!hasMedia()){if(list.length)load(0,true);else $('fileIn').click();return}v.paused?go():v.pause()}
function next(dir=1){if(live){tvStep(dir);return}if(!list.length)return;let n;
  if(shuffle&&list.length>1){do n=Math.random()*list.length|0;while(n===cur)}else n=cur+dir;
  if(n>=list.length){if(loop===1||S.queueEnd==='repeat')n=0;else return}if(n<0)n=list.length-1;load(n,true)}

/* ---------- Audio graph ---------- */
function initAudio(){
  if(ac){ac.resume();return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaElementSource(v);
    N.delay=ac.createDelay(1);N.split=ac.createChannelSplitter(2);N.merge=ac.createChannelMerger(2);
    N.m=[0,1,2,3].map(()=>ac.createGain());
    src.connect(N.delay);N.delay.connect(N.split);
    N.split.connect(N.m[0],0);N.m[0].connect(N.merge,0,0);N.split.connect(N.m[1],0);N.m[1].connect(N.merge,0,1);
    N.split.connect(N.m[2],1);N.m[2].connect(N.merge,0,0);N.split.connect(N.m[3],1);N.m[3].connect(N.merge,0,1);
    let last=N.merge;N.eq=FREQ.map((f,i)=>{const b=ac.createBiquadFilter();b.type=i===0?'lowshelf':i===9?'highshelf':'peaking';b.frequency.value=f;b.Q.value=1.1;last.connect(b);last=b;return b});
    N.dry=ac.createGain();N.wet=ac.createGain();N.comp=ac.createDynamicsCompressor();N.comp.threshold.value=-30;N.comp.ratio.value=8;N.comp.knee.value=12;
    N.post=ac.createGain();last.connect(N.dry);last.connect(N.comp);N.comp.connect(N.wet);N.dry.connect(N.post);N.wet.connect(N.post);
    N.gain=ac.createGain();N.post.connect(N.gain);N.an=ac.createAnalyser();N.an.fftSize=256;N.gain.connect(N.an);N.an.connect(ac.destination);
    N.data=new Uint8Array(N.an.frequencyBinCount);applyAudio();
  }catch(e){ac=null}
}
function applyAudio(){if(!ac)return;
  const mtx={stereo:[1,0,0,1],swap:[0,1,1,0],mono:[.5,.5,.5,.5]}[S.channels];N.m.forEach((g,i)=>g.gain.value=mtx[i]);
  N.eq.forEach((b,i)=>b.gain.value=S.eq[i]);N.dry.gain.value=S.night?0:1;N.wet.gain.value=S.night?1.6:0;N.delay.delayTime.value=S.adelay/1000;
  N.gain.gain.value=curVol>1?curVol:1}
let curVol=store.get('vol',.8);
function setVol(x,show){const max=+S.boost/100;const before=curVol;curVol=clamp(x,0,max);v.muted=false;v.volume=Math.min(1,curVol);if(N.gain)N.gain.gain.value=curVol>1?curVol:1;
  if(curVol>1&&!ac)initAudio();paintVol();store.set('vol',curVol);if(show)osd(t('volume')+' '+Math.round(curVol*100)+'%');if(curVol>=1.5&&before<1.5)tiguReact('loud')}
function paintVol(){const r=$('vol'),max=+S.boost/100;r.max=max;r.value=v.muted?0:curVol;r.style.setProperty('--v',(v.muted?0:curVol/max*100)+'%');
  $('volOut').textContent=(v.muted?0:Math.round(curVol*100))+'%';$('bMute').classList.toggle('on',v.muted)}

/* ---------- RGB lighting ---------- */
const hexToRgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const rgbToHex=a=>'#'+a.map(x=>clamp(x|0,0,255).toString(16).padStart(2,'0')).join('');
function tune(hex,b,s){let[r,g,bb]=hexToRgb(hex).map(x=>x/255);const mx=Math.max(r,g,bb),mn=Math.min(r,g,bb);let h=0,sa=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;sa=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-bb)/d+(g<bb?6:0):mx===g?(bb-r)/d+2:(r-g)/d+4;h*=60}
  return`hsl(${h.toFixed(0)} ${(clamp(sa*s,0,1)*100).toFixed(0)}% ${(clamp(l*b,0,.97)*100).toFixed(0)}%)`}
function palette(){let p=S.rgbPal==='custom'?S.rgbCustom:S.rgbPal==='mono'?[S.accent,rgbToHex(hexToRgb(S.accent).map(x=>x+(255-x)*.6))]:PAL[S.rgbPal];return p.map(c=>tune(c,S.rgbBright/100,S.rgbSat/100))}
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let specStart=performance.now();
function applyRGB(){
  const motion=RM.matches?'static':S.rgbMotion,fx=S.rgbFx,p=palette(),n=p.length,P=480;
  const st=[...p,p[0]].map((c,i)=>`${c} calc(${(i*P/n).toFixed(1)}px + var(--off))`).join(',');
  const dirs={e:[90,0],w:[90,1],s:[180,0],n:[180,1],ne:[45,0],sw:[45,1],se:[135,0],nw:[135,1]};
  const[ang,rev]=dirs[S.rgbDir]||[90,0],dur=S.rgbSpeed+'s',it=motion==='once'?'1':'infinite';
  let img='',anim='none',extra='';
  if(fx==='wave'){img=`repeating-linear-gradient(${ang}deg,${st})`;anim=`rgbOff ${dur} linear ${it} ${rev?'reverse':'normal'}`}
  else if(fx==='rotate'){img=`conic-gradient(from var(--rot),${[...p,p[0]].join(',')})`;anim=`rgbRot ${dur} linear ${it} ${rev?'reverse':'normal'}`}
  else if(fx==='ripple'){img=`repeating-radial-gradient(circle at 12% 100%,${st})`;anim=`rgbOff ${dur} linear ${it} ${rev?'reverse':'normal'}`}
  else if(fx==='breath'){img=`linear-gradient(${ang}deg,${p.join(',')})`;anim=`rgbBreath ${dur} ease-in-out ${it}`}
  else if(fx==='audio'){img=`linear-gradient(${ang}deg,${p.join(',')})`;extra='filter:brightness(var(--beat,1)) saturate(var(--beat,1));'}
  if(motion==='static')anim='none';
  const Z=[['ring','.stage::before'],['ring','.stage::after'],['seek','.fill'],['play','.ib.main'],['logo','.mark'],['drawer','.dhead::after']];
  const sel=['.rgbprev',...Z.map(([z,s])=>`body.z-${z} ${s}`)];
  let css='';
  if(img){css+=`${sel.join(',')}{background-image:${img};animation:${anim};${extra}}`;
    css+=`body.z-corners .corner{border-image:${img} 1;animation:${anim};opacity:.9}`;
    css+=`body.z-ring .stage::after{${fx==='breath'?'':'filter:blur(9px)'}}`;
    css+=`body.rgb-calm .stage::before,body.rgb-calm .stage::after,body.rgb-calm .fill,body.rgb-calm .ib.main,body.rgb-calm .mark,body.rgb-calm .corner{animation-play-state:paused!important}body.rgb-calm .stage::before{opacity:.45}body.rgb-calm .stage::after{opacity:.08}`;}
  $('rgbStyle').textContent=css;
  ZONES.forEach(([z])=>document.body.classList.toggle('z-'+z,S.rgbZones.includes(z)));
  specStart=performance.now();if(fx!=='spectrum')applyKey('accent');
  updCalm()}
function updCalm(){document.body.classList.toggle('rgb-calm',S.rgbCalm&&isPlaying())}

/* ---------- Visualizer + frame loop ---------- */
const cv=$('viz'),cx=cv.getContext('2d');
function frame(now){
  if(S.rgbFx==='spectrum'&&S.rgbMotion!=='static'&&!RM.matches&&!(S.rgbCalm&&isPlaying())){const e=(now-specStart)/1000/S.rgbSpeed;if(S.rgbMotion==='loop'||e<1){const h=(e*360+hexHue(S.accent))%360;root.style.setProperty('--accent',`hsl(${h.toFixed(0)} ${Math.round(85*S.rgbSat/100)}% ${Math.round(clamp(55*S.rgbBright/100,10,90))}%)`);root.style.setProperty('--accent-ink',(h>40&&h<200)?'#111':'#fff')}}

  const hx=document.createElement('div');hx.className='hexrow';hx.innerHTML=`<div class="prev cut"></div><label class="vh" for="hexIn">Hex colour</label><input id="hexIn" value="${S.accent}" maxlength="7" spellcheck="false"><input type="color" id="pickIn" value="${S.accent}" aria-label="Colour picker">`;
  w.append(sw,hx);const rgb=hexToRgb(S.accent),rows=[];
  ['R','G','B'].forEach((ch,i)=>{const r=document.createElement('div');r.className='rgbrow';const col=['#ff3b3b','#22c55e','#3b82f6'][i];
    r.innerHTML=`<span style="color:${col}">${ch}</span><input type="range" min="0" max="255" value="${rgb[i]}" aria-label="${ch} channel" style="background:linear-gradient(90deg,${['#000,#f00','#000,#0f0','#000,#00f'][i]})"><input type="number" min="0" max="255" value="${rgb[i]}" aria-label="${ch} value">`;rows.push(r);w.appendChild(r)});
  const pull=()=>rows.map(r=>+r.querySelector('input[type=range]').value);
  const push=hex=>{if(!/^#[0-9a-f]{6}$/i.test(hex))return;set('accent',hex.toLowerCase());hx.querySelector('#hexIn').value=hex;hx.querySelector('#pickIn').value=hex;
    hexToRgb(hex).forEach((x,i)=>{rows[i].querySelector('input[type=range]').value=x;rows[i].querySelector('input[type=number]').value=x})};
  rows.forEach(r=>{const[rg,nm]=r.querySelectorAll('input');rg.oninput=()=>{nm.value=rg.value;push(rgbToHex(pull()))};nm.onchange=()=>{rg.value=clamp(+nm.value,0,255);push(rgbToHex(pull()))}});
  hx.querySelector('#hexIn').onchange=e=>{const x=e.target.value.trim();push(x.startsWith('#')?x:'#'+x)};
  hx.querySelector('#pickIn').oninput=e=>push(e.target.value);
  return w}
function dirCtl(){const w=document.createElement('div');w.className='dirpad';const fx=S.rgbFx,usable=['wave','rotate','ripple','breath','audio'].includes(fx);
  [['nw','↖'],['n','↑'],['ne','↗'],['w','←'],['',(fx==='rotate'?'⟳':fx==='ripple'?'◎':'·')],['e','→'],['sw','↙'],['s','↓'],['se','↘']].forEach(([d,a])=>{const b=document.createElement('button');b.textContent=a;
    if(!d){b.disabled=true;b.setAttribute('aria-hidden','true')}else{b.setAttribute('aria-label','Direction '+d);b.setAttribute('aria-pressed',S.rgbDir===d);b.disabled=!usable;b.onclick=()=>{set('rgbDir',d);[...w.children].forEach(x=>x.setAttribute('aria-pressed',x===b))}}w.appendChild(b)});
  return w}
function palCtl(){const w=document.createElement('div');w.style.width='100%';const g=document.createElement('div');g.className='pals';
  Object.keys(PAL).forEach(k=>{const b=document.createElement('button');b.setAttribute('aria-pressed',S.rgbPal===k);
    const cols=k==='custom'?S.rgbCustom:k==='mono'?[S.accent,'#ffffff']:PAL[k];b.innerHTML=`<span class="bar" style="background:linear-gradient(90deg,${cols.join(',')})"></span>${PALN[k]}`;
    b.onclick=()=>{set('rgbPal',k);renderList()};g.appendChild(b)});w.appendChild(g);
  if(S.rgbPal==='custom'){const c=document.createElement('div');c.className='custom';
    S.rgbCustom.forEach((col,i)=>{const inp=document.createElement('input');inp.type='color';inp.value=col;inp.setAttribute('aria-label','Colour '+(i+1));inp.oninput=()=>{S.rgbCustom[i]=inp.value;save();applyRGB()};c.appendChild(inp)});
    const add=document.createElement('button');add.className='chip sm';add.textContent='+ Add';add.disabled=S.rgbCustom.length>=6;add.onclick=()=>{S.rgbCustom.push('#ffffff');save();applyRGB();renderList()};
    const rm=document.createElement('button');rm.className='chip sm';rm.textContent='− Remove';rm.disabled=S.rgbCustom.length<=2;rm.onclick=()=>{S.rgbCustom.pop();save();applyRGB();renderList()};
    c.append(add,rm);w.appendChild(c)}
  return w}
function zoneCtl(){const w=document.createElement('div');w.className='zones';ZONES.forEach(([z,lab])=>{const b=document.createElement('button');b.textContent=lab;b.setAttribute('aria-pressed',S.rgbZones.includes(z));
  b.onclick=()=>{const i=S.rgbZones.indexOf(z);i<0?S.rgbZones.push(z):S.rgbZones.splice(i,1);save();applyRGB();b.setAttribute('aria-pressed',S.rgbZones.includes(z))};w.appendChild(b)});return w}
function urlCtl(){const w=document.createElement('div');w.className='urls';
  S.tvCustom.forEach((u,i)=>{const r=document.createElement('div');r.className='u';r.innerHTML=`<span></span><button class="chip sm">Remove</button>`;r.firstChild.textContent=u;r.lastChild.onclick=()=>{S.tvCustom.splice(i,1);save();renderList()};w.appendChild(r)});
  const a=document.createElement('div');a.className='add';a.innerHTML=`<label class="vh" for="m3uUrl">Playlist link</label><input class="txt" id="m3uUrl" placeholder="https://example.com/playlist.m3u"><button class="chip sm primary">Add link</button><button class="chip sm">Import file</button>`;
  const[inp,addB,fileB]=a.querySelectorAll('input,button');
  addB.onclick=()=>{const u=inp.value.trim();if(!/^https?:\/\//i.test(u)){inp.focus();osd('Enter a full https:// link');return}if(!S.tvCustom.includes(u))S.tvCustom.push(u);save();renderList();tvUpdate(true)};
  fileB.onclick=()=>$('m3uIn').click();w.appendChild(a);return w}
function eqCtl(){const w=document.createElement('div');w.style.width='100%';const s=document.createElement('div');s.className='seg';
  [['flat','Flat'],['bass','Bass'],['vocal','Vocal'],['footsteps','Footsteps'],['treble','Treble']].forEach(([k,lab])=>{const b=document.createElement('button');b.textContent=lab;b.setAttribute('aria-pressed',S.eqPreset===k);
    b.onclick=()=>{S.eqPreset=k;set('eq',[...EQP[k]]);renderList()};s.appendChild(b)});
  const g=document.createElement('div');g.className='eq';
  BANDS.forEach((b,i)=>{const l=document.createElement('label');const r=document.createElement('input');r.type='range';r.min=-12;r.max=12;r.step=1;r.value=S.eq[i];r.setAttribute('aria-label',b+' Hz');
    const val=document.createElement('span');const upd=()=>{val.textContent=(S.eq[i]>0?'+':'')+S.eq[i];r.style.setProperty('--v',(S.eq[i]+12)/24*100+'%')};upd();
    r.oninput=()=>{S.eq[i]=+r.value;S.eqPreset='custom';save();if(!ac)initAudio();applyAudio();upd();[...s.children].forEach(x=>x.setAttribute('aria-pressed',false))};
    const f=document.createElement('span');f.textContent=b;l.append(val,r,f);g.appendChild(l)});
  const h=document.createElement('div');h.className='hn';h.textContent='Footsteps lifts 2–8 kHz, where steps and reloads sit in game clips. Range ±12 dB.';
  w.append(s,g,h);return w}
function hkCtl(){const tb=document.createElement('table');tb.className='hk';
  Object.keys(HK_DEF).forEach(a=>{const tr=document.createElement('tr');const td=document.createElement('td');td.textContent=L(HKL[a]);const td2=document.createElement('td');const b=document.createElement('button');
    b.textContent=capture===a?'Press a key…':keyName(S.hotkeys[a]||'—');if(capture===a)b.className='wait';b.onclick=()=>{capture=a;renderList()};td2.appendChild(b);tr.append(td,td2);tb.appendChild(tr)});
  const w=document.createElement('div');w.style.width='100%';const h=document.createElement('div');h.className='hn';h.style.marginTop='8px';h.textContent='Select a shortcut, then press the new key. Esc cancels.';w.append(tb,h);return w}

/* ---------- Apply ---------- */
function applyKey(k){
  if(k==='theme'){if(S.theme==='system'){hostTheme?root.setAttribute('data-theme',hostTheme):root.removeAttribute('data-theme')}else root.setAttribute('data-theme',S.theme)}
  if(k==='accent'){if(S.rgbFx!=='spectrum'||S.rgbMotion==='static'){root.style.setProperty('--accent',S.accent);const[r,g,b]=hexToRgb(S.accent);root.style.setProperty('--accent-ink',(.299*r+.587*g+.114*b)>165?'#111':'#fff')}if(S.rgbPal==='mono')applyRGB()}
  if(k==='glow')root.style.setProperty('--glow-k',S.glow);
  if(k==='corners'){document.body.classList.remove('corners-sharp','corners-chamfer','corners-round');document.body.classList.add('corners-'+S.corners)}
  if(k==='scale'){root.style.setProperty('--zoom',S.scale/100);layoutVideo()}
  if(k==='anim')root.style.setProperty('--t',{off:0,fast:.5,smooth:1}[S.anim]);
  if(k.startsWith('rgb'))applyRGB();
  if(k==='remaining')paint();
  if(k==='lang')applyLang();
  if(k==='speed'&&!live)v.playbackRate=+S.speed;
  if(k==='pitch')v.preservesPitch=S.pitch;
  if(['brightness','contrast','saturation','hue','sharpen'].includes(k))applyVideo();
  if(['aspect','zoom','rotate','flip'].includes(k))layoutVideo();
  if(['eq','night','channels','adelay'].includes(k)){if(!ac&&(k!=='eq'||S.eq.some(Boolean)))initAudio();applyAudio()}
  if(k==='boost')setVol(Math.min(curVol,+S.boost/100));
  if(['subSize','subColor','subBg','subOutline','subFont'].includes(k))applySubStyle();
  if(k==='subDelay')applySubDelay();if(k==='subPos')applySubPos();
  if(k==='stats')applyStats();if(k==='mediakeys')mediaMeta();
  if(k==='stepShort')renderKeys();
  if(k==='tvHideDead')renderTV();
  if(k==='tiguSize'){sw=0;tg.x=-1}
}
function applyLang(){const L0=LANGS.find(x=>x[0]===S.lang)||LANGS[0],script=L0[4],dir=L0[5]||'ltr';root.lang=S.lang;root.dir=dir;
  const f=FONTS[script];if(f&&!document.querySelector(`link[data-f="${script}"]`)){const l=document.createElement('link');l.rel='stylesheet';l.dataset.f=script;l.href='https://fonts.googleapis.com/css2?family='+f.replace(/ /g,'+')+':wght@400;600;700&display=swap';document.head.appendChild(l)}
  root.style.setProperty('--f-script',f?`"${f}"`:'system-ui');
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  document.querySelectorAll('[data-t]').forEach(el=>{el.title=t(el.dataset.t);el.setAttribute('aria-label',t(el.dataset.t))});
  document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=t(el.dataset.ph));
  setNow();renderQueue();renderKeys();renderTV();if(hasMedia())$('bPlay').title=v.paused?t('play'):t('pause')}

/* ---------- Export mpv.conf ---------- */
$('bExport').onclick=()=>{const c=[`# Liger Player → mpv.conf (generated ${new Date().toISOString().slice(0,10)})`,
  `vo=${S.eng_vo}`,`hwdec=${S.eng_hwdec}`,
  S.eng_scale==='fsr'?'glsl-shaders-append="~~/shaders/FSR.glsl"':S.eng_scale==='nvscaler'?'glsl-shaders-append="~~/shaders/NVScaler.glsl"':`scale=${S.eng_scale}`,
  ...(S.eng_interp?['video-sync=display-resample','interpolation=yes','tscale=oversample']:[]),`deband=${S.eng_deband?'yes':'no'}`,`deinterlace=${S.eng_deint?'yes':'no'}`,
  `tone-mapping=${S.eng_tonemap}`,`target-peak=${S.eng_peak}`,`dither-depth=${S.eng_dither}`,`icc-profile-auto=${S.eng_icc?'yes':'no'}`,
  `brightness=${S.brightness-100}`,`contrast=${S.contrast-100}`,`saturation=${clamp(S.saturation-100,-100,100)}`,`hue=${Math.round(S.hue/1.8)}`,
  `video-rotate=${S.rotate}`,`video-zoom=${Math.log2(S.zoom/100).toFixed(3)}`,S.aspect.includes(':')?`video-aspect-override=${S.aspect}`:'# video-aspect-override=no',
  `speed=${S.speed}`,`save-position-on-quit=${S.resume?'yes':'no'}`,`loop-playlist=${S.queueEnd==='repeat'?'inf':'no'}`,
  `volume-max=${S.boost}`,`audio-delay=${(S.adelay/1000).toFixed(3)}`,`audio-exclusive=${S.eng_exclusive?'yes':'no'}`,S.eng_passthrough?'audio-spdif=ac3,dts,eac3,truehd,dts-hd':'# audio-spdif=',
  S.eng_normalize?'af-append=lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]':'# loudnorm off',S.night?'af-append=lavfi=[acompressor=threshold=-30dB:ratio=8]':'# night mode off',
  S.eq.some(Boolean)?'af-append=lavfi=['+FREQ.map((f,i)=>`equalizer=f=${f}:t=q:w=1.1:g=${S.eq[i]}`).join(',')+']':'# equalizer flat',
  S.channels==='mono'?'af-append=lavfi=[pan=mono|c0=0.5*c0+0.5*c1]':S.channels==='swap'?'af-append=lavfi=[pan=stereo|c0=c1|c1=c0]':'# channels stereo',
  `sub-font-size=${Math.round(55*S.subSize/100)}`,`sub-color="${S.subColor}"`,`sub-back-color="#${Math.round(S.subBg*2.55).toString(16).padStart(2,'0')}000000"`,`sub-border-size=${S.subOutline?3:0}`,
  `sub-pos=${100-S.subPos*5}`,`sub-delay=${(S.subDelay/1000).toFixed(3)}`,`cache=yes`,`demuxer-max-bytes=${S.eng_cache}MiB`,S.eng_lowlat?'profile=low-latency':'# profile=low-latency',
  `screenshot-format=${S.shotFmt==='jpeg'?'jpg':S.shotFmt}`,`screenshot-jpeg-quality=${S.shotQ}`,`screenshot-webp-quality=${S.shotQ}`,`osd-level=${S.osd?1:0}`].join('\n');
  showModal(`<h3>mpv.conf</h3><p>Your Liger settings as an mpv config, for the desktop build or for mpv itself.</p><label class="vh" for="confTxt">mpv.conf</label><textarea id="confTxt" readonly></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip cut primary" id="mCopy">Copy</button><button class="chip cut" id="mClose">${t('close')}</button></div>`);
  $('confTxt').value=c;$('mCopy').onclick=()=>{navigator.clipboard.writeText(c).then(()=>$('mCopy').textContent='Copied',()=>{$('confTxt').select();$('mCopy').textContent='Press Ctrl+C'})}};

$('bReset').onclick=()=>{const keep={lang:S.lang,tvFav:S.tvFav,tvCustom:S.tvCustom};S=JSON.parse(JSON.stringify(D));Object.assign(S,keep);save();applyAll();renderList();osd(t('reset'))};
function applyAll(){['theme','accent','glow','corners','scale','anim','lang','speed','pitch','brightness','eq','boost','subSize','stats','rgbFx'].forEach(applyKey);applyVideo();applyAudio();applySubStyle()}

/* ---------- Boot ---------- */
list.push({name:'Liger demo loop',url:demoWav(),kind:'audio',demo:true,dur:16});
applyAll();setVol(curVol);load(0,false);renderTV();
const age=Date.now()-(TV.updated||0);
if(S.tvAuto==='launch'||(S.tvAuto==='daily'&&age>864e5)||(S.tvAuto==='weekly'&&age>6048e5))setTimeout(()=>tvUpdate(false),1500);
requestAnimationFrame(frame);
})();
</script>
